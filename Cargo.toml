[workspace]
resolver = "2"
members = [
    "crates/librime-sys2",
    "crates/librime",
    "crates/xime-config",
    "crates/xime-rime",
    "crates/xime-ipc",
    "crates/xime-plugin",
    "crates/xime-setup",
    # ---- 同步服务（MIT，与 GPL 输入法部分分离）----
    "crates/xime-sync-domain",
    "crates/xime-sync-store",
    "crates/xime-sync-service",
    "crates/xime-sync-server",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/ximeiorg/libximecore"

# 许可说明：本 workspace 混合许可。
# - librime / xime-config / xime-rime / xime-ipc / xime-plugin / xime-setup：GPL-3.0-or-later
# - xime-sync-*（同步服务）：MIT（各自 Cargo.toml 中 license = "MIT"）
[workspace.dependencies]
# ---- 输入法核心 ----
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
tracing = "0.1"
once_cell = "1"

# ---- 同步服务（xime-sync-*）----
async-trait = "0.1"
axum = { version = "0.8", features = ["ws", "tokio"] }
axum-server = { version = "0.7", features = ["tls-rustls"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time", "fs", "rt"] }
tokio-stream = "0.1"
tokio-tungstenite = "0.24"
futures-util = "0.3"
base64 = "0.22"
getrandom = "0.3"
config = "0.15"
sha2 = "0.10"
subtle = "2"
http = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled"] }
arboard = { version = "3", features = ["wayland-data-control"] }
hmac = "0.12"
hex = "0.4"
toml = "0.9"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tempfile = "3"

# 同步 crate 内部依赖
xime-sync-domain = { path = "crates/xime-sync-domain" }
xime-sync-store = { path = "crates/xime-sync-store" }
xime-sync-service = { path = "crates/xime-sync-service" }
xime-sync-server = { path = "crates/xime-sync-server" }
