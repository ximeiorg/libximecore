    keyboard_background:
      type: solid
      color: 0xfdf0e3
      color_dark: 0xfdf0e3
    candidate_text_color: 0x7a5130
    candidate_text_color_dark: 0x7a5130

  cream_beige:
    name: "奶油米白"
    primary_color: 0x8d6e63
    keyboard_background:
      type: solid
      color: 0xfaf5ee
      color_dark: 0xfaf5ee
    candidate_text_color: 0x5d4037
    candidate_text_color_dark: 0x5d4037

  aurora_gradient:
    name: "极光青蓝"
    primary_color: 0x00b0a8
    keyboard_background:
      type: gradient
      colors: [0xe0f7fa, 0xb2ebf2]
      colors_dark: [0x001915, 0x003d38]
      angle: 90
    candidate_text_color: 0x14444a
    candidate_text_color_dark: 0xe0f7fa

  sunset_gradient:
    name: "落日余晖"
    primary_color: 0xff7043
    keyboard_background:
      type: gradient
      colors: [0xfff3e0, 0xffccbc]
      # 暗端原为 0x8c2f1d（L0.44 / C0.13）：锈红大面积铺底在暗环境偏亮，压到 L0.32 以下。
      colors_dark: [0x260703, 0x5a170a]
      angle: 90
    candidate_text_color: 0x5d2a17
    candidate_text_color_dark: 0xffe0d6

  ocean_gradient:
    name: "深海渐变"
    primary_color: 0x1e88e5
    keyboard_background:
      type: gradient
      colors: [0xe3f2fd, 0x90caf9]
      # 暗端原为 0x0d47a1（L0.42 / C0.16）：压到 L0.32 以下，避免整个候选窗发亮。
      colors_dark: [0x01132a, 0x0f2f63]
      angle: 90
    candidate_text_color: 0x0d3a5c
    candidate_text_color_dark: 0xd6eaff

  purple_gradient:
    name: "紫梦渐变"
    primary_color: 0x7e57c2
    keyboard_background:
      type: gradient
      colors: [0xede7f6, 0xd1c4e9]
      # 暗端原为 0x4527a0（C=0.181 是全表最高彩度），压到 C0.10 / L0.31。
      colors_dark: [0x130d29, 0x2f2661]
      angle: 90
    candidate_text_color: 0x3c2a66
    candidate_text_color_dark: 0xe8def8

  rose_gradient:
    name: "玫瑰渐变"
    primary_color: 0xec407a
    keyboard_background:
      type: gradient
      colors: [0xfce4ec, 0xf8bbd0]
      # 暗端原为 0x8c1356（L0.43 / C0.16）：整个候选窗在暗环境下像发光板，压到 L0.32 以下。
      colors_dark: [0x240614, 0x551535]
      angle: 90
    candidate_text_color: 0x5d1035
    candidate_text_color_dark: 0xffdbe8

  forest_gradient:
    name: "森林迷雾"
    primary_color: 0x43a047
    keyboard_background:
      type: gradient
      colors: [0xe8f5e9, 0xc8e6c9]
      # 暗端原为 0x1b5e20（L0.43 / C0.12）：压到 L0.32 以下，避免整个候选窗发亮。
      colors_dark: [0x001904, 0x013e09]
      angle: 90
    candidate_text_color: 0x1e4620
    candidate_text_color_dark: 0xdff5e0

  kitosonita_landscape:
    name: "夜幕之影"
    keyboard_background:
      type: image
      src: "themes/lll-sh-silhouette-bg.jpg"
      fit: cover
      overlay_alpha: 0.15
      overlay_alpha_dark: 0.30
    candidate_text_color: 0x232323
    candidate_text_color_dark: 0xf2f2f2
