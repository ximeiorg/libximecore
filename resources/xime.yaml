# 曦码 xime.yaml —— 桌面端配置基座（随安装包分发，升级时被覆盖，勿直接修改）
# 用户自定义写同目录 xime.custom.yaml：只写要改的键，未写的键自动回退本文件；
# 列表（xime_index.base_urls 等）需整段写出。与移动端同一套字段命名。
# 颜色写 0xRRGGBB；移动端的 0xAARRGGBB（带透明度）桌面端只取低 24 位。

metadata:
  app_name: Xime
  app_version: ">=0.3.0"      # 配置适用的最低客户端版本（当前未参与校验）
  platform: [windows, linux, macos]
  config_version: 1
  generator: "Xime Config Generator"
  modified_time: "2026-11-16"

xime_index:
  # 方案 / 插件 / 模型市场索引基址（ximeiorg/xime-index），按顺序尝试直到成功。
  # 可替换为自建代理 / 镜像；末尾需 /。
  base_urls:
    - "https://cdn.jsdelivr.net/gh/ximeiorg/xime-index@master/"
    - "https://fastly.jsdelivr.net/gh/ximeiorg/xime-index@master/"
    - "https://index.ximei.me/"
    - "https://raw.githubusercontent.com/ximeiorg/xime-index/refs/heads/main/"

style:
  font_family: ""             # 候选窗字体，空 = 跟随系统
  font_size: 14.0
  candidate_count: 5          # 落成 rime 的 menu/page_size，改动需重新部署
  horizontal: true
  corner_radius: 8.0
  # 配色方案 id（color_schemes 的键）。浅色与深色是方案内成对的变体，由 dark_mode 选择。
  color_scheme: lavender_purple
  dark_mode: 2                # 0=浅色 1=深色 2=跟随系统

# ── 配色方案 ──
# 每个主题可用的颜色字段（未配置的由宿主派生）：
#   primary_color                       主题强调色（选中/高亮）
#   keyboard_background                 候选窗背景（solid / gradient / image）
#   candidate_text_color / _dark        候选文字色
#   candidate_selected_text_color / _dark   候选选中文字色
#   candidate_selected_bg_color / _dark     候选选中背景色，支持 0xAARRGGBB 的透明度
#
# 桌面端只读候选窗用得到的颜色；按键与功能键底色（key_*、special_key_*）属于软键盘，
# 本文件不写，写了也不读。
#
# 暗色配色约束（新增皮肤请遵守）：
# 1. 渐变皮肤的 colors_dark 暗端压到 OKLCH L ≤ 0.32 / C ≤ 0.10，避免整个候选窗过亮。
# 2. 候选文字与窗口背景的对比度不低于 4.5:1（深底别直接拿 primary 当正文色）。
# 3. 选中底色与普通底色要能分辨；只靠透明度差时，选中文字需要自带对比度。

color_schemes:
  lavender_purple:
    name: "薰衣草紫"
    primary_color: 0x8F73E2
    keyboard_background:
      type: solid
      color: 0xE3E4E8
      color_dark: 0x1E1838

  ocean_blue:
    name: "海洋蔚蓝"
    primary_color: 0x1A73E8
    keyboard_background:
      type: solid
      color: 0xE3E4E8
      color_dark: 0x0D1B33

  sunset_orange:
    name: "落日橙光"
    primary_color: 0xE65100
    keyboard_background:
      type: solid
      color: 0xE3E4E8
      color_dark: 0x1A0D00

  slate_gray:
    name: "沉稳石墨"
    primary_color: 0x424242
    # 灰色系 primary 提亮后仍偏暗（≈0x979797），深色模式首选项单独提亮保证辨识度
    # （非纯白，高对比在暗光下刺眼；普通候选为 0xE8EAED，靠字重+高亮底区分）
    candidate_selected_text_color_dark: 0xF0F0F0
    keyboard_background:
      type: solid
      color: 0xE3E4E8
      color_dark: 0x1A1A1A

  rose_pink:
    name: "浪漫玫瑰"
    primary_color: 0xAD1457
    keyboard_background:
      type: solid
      color: 0xE3E4E8
      color_dark: 0x2D1020

  teal_cyan:
    name: "青碧如水"
    primary_color: 0x00796B
    keyboard_background:
      type: solid
      color: 0xE3E4E8
      color_dark: 0x002622

  sakura_pink:
    name: "樱花粉黛"
    primary_color: 0xe91e63
    keyboard_background:
      type: solid
      color: 0xfdf0f4
      color_dark: 0xfdf0f4
    candidate_text_color: 0x7d3a52
    candidate_text_color_dark: 0x7d3a52

  sky_blue:
    name: "晴空浅蓝"
    primary_color: 0x0288d1
    keyboard_background:
      type: solid
      color: 0xe8f4fd
      color_dark: 0xe8f4fd
    candidate_text_color: 0x2d5f7a
    candidate_text_color_dark: 0x2d5f7a

  mint_green:
    name: "薄荷浅绿"
    primary_color: 0x2e7d32
    keyboard_background:
      type: solid
      color: 0xe9f5ec
      color_dark: 0xe9f5ec
    candidate_text_color: 0x3c5c44
    candidate_text_color_dark: 0x3c5c44

  lilac_purple:
    name: "丁香浅紫"
