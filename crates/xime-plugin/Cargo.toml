[package]
name = "xime-plugin"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Xime JS plugin runtime (QuickJS), installer and manifest (platform-agnostic)"
repository.workspace = true

[dependencies]
quickjs-rusty.workspace = true
# 中断处理器签名需要 JSRuntime 类型（与 quickjs-rusty 同源的 FFI 绑定）
libquickjs-ng-sys = "0.13.1"
serde = { workspace = true, features = ["derive"] }
serde_yaml.workspace = true
serde_json.workspace = true
json5.workspace = true
thiserror.workspace = true
tracing.workspace = true
zip = "8.6.0"
flate2 = "1"
reqwest.workspace = true
# host.crypto（clipboard_sync 协议插件：Basic Auth / S3 SigV4）
sha2.workspace = true
sha1.workspace = true
hmac.workspace = true
hex.workspace = true
base64.workspace = true
# 插件配置值加密（cipher：AES-256-GCM + DPAPI 密钥保护，对齐 Android SecureValueCipher）
aes-gcm.workspace = true
getrandom.workspace = true

[features]
default = []
