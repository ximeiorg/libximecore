# ximed 默认配置 —— 内嵌进二进制（include_str!），全部配置项及默认值。

[server]
addr = "0.0.0.0:8443"          # 监听地址
data_dir = "./data"             # 数据目录（存储后端用）
log_level = "info"              # trace/debug/info/warn/error
# workers = 1                   # tokio worker 线程数（缺省 = 按 CPU，低端设备可设 1）

[auth]
username = "alice"              # Basic Auth 用户名
# password = "your-password"    # 密码（可选）：直接写在配置文件；更推荐用环境变量
password_env = "XIMED_AUTH_PASSWORD" # 密码环境变量名（环境变量优先级高于 password 字段）
max_connections = 32            # 最大并发连接（WS/SSE 合计），防资源耗尽

[clipboard]
max_frame_size = 16777216        # 单帧/单条上限（字节，默认 16MB，覆盖 10MB 图片 base64 膨胀）
idle_timeout_secs = 60          # 长连接无消息判定离线（秒）
heartbeat_interval_secs = 30    # 客户端心跳间隔（秒，客户端按此值发 ping）

[http]
enabled = true                  # 是否启用 HTTP REST 通道（Xime 主通道）
bind_timeout_ms = 5000          # 单请求超时（毫秒）

[ws]
enabled = true                  # 是否启用 WebSocket 通道（端点固定 /sync）

[sse]
enabled = true                  # 是否启用 SSE 通道（端点固定 /events）
heartbeat_ms = 15000            # SSE 服务器 ping 间隔（毫秒）

[storage]
backend = "local"               # local | webdav | s3
# —— webdav 后端（backend = "webdav"，构建时启用：--features store/webdav）——
# url = "https://dav.example.com/dav/ximed/"   # WebDAV 根地址
# username = "davuser"
# password_env = "XIMED_WEBDAV_PASSWORD"       # 密码从该环境变量读取
# —— s3 后端（backend = "s3"，schema 预留，后端实现未合入）——
# endpoint = "https://s3.example.com"          # S3 端点（缺省 = AWS 区域默认端点）
# bucket = "ximed"
# region = "ap-east-1"
# access_key_env = "XIMED_S3_ACCESS_KEY"       # 访问密钥从环境变量读取
# secret_key_env = "XIMED_S3_SECRET_KEY"       # 密钥从环境变量读取

[tls]                            # 未来 HTTPS（feature = tls 时启用，rustls）
enabled = false
cert_env = "XIMED_TLS_CERT"
key_env = "XIMED_TLS_KEY"
