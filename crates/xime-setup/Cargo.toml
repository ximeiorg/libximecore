[package]
name = "xime-setup-lib"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Xime input method setup GUI library (platform-agnostic)"
repository.workspace = true

[lib]
name = "xime_setup_lib"

[[bin]]
name = "xime-setup"
path = "src/main.rs"

[dependencies]
iced = { version = "0.14", default-features = false, features = [
    "tokio",
    "wgpu",
    "tiny-skia",
    "image",
    "svg",
    "x11",
    "wayland",
] }
xime-config = { path = "../xime-config" }
xime-plugin = { path = "../xime-plugin" }
serde = { workspace = true, features = ["derive"] }
serde_yaml.workspace = true
tracing.workspace = true
rust-embed = { version = "8", features = ["interpolate-folder-path", "include-exclude"] }
anyhow = "1.0"
ureq = "3.3.0"
zip = "8.6.0"
tar = "0.4"
flate2 = "1"
sha2 = "0.10"
hex = "0.4"
toml.workspace = true
base64.workspace = true
getrandom.workspace = true
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_System_Registry",
    "Win32_UI_WindowsAndMessaging",
] }

[features]
default = []
smart-suggestion-page = []
pair-page = []
clipboard-page = []
