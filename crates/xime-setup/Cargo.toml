[package]
name = "xime-setup-lib"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Xime input method setup GUI library (platform-agnostic)"
repository.workspace = true

[lib]
name = "xime_setup_lib"

[[bin]]
name = "xime-setup"
path = "src/main.rs"

[dependencies]
iced = { version = "0.14", default-features = false, features = [
    "tokio",
    "wgpu",
    "tiny-skia",
    "image",
    "svg",
    "x11",
    "wayland",
] }
xime-config = { path = "../xime-config" }
xime-plugin = { path = "../xime-plugin" }
# 词库导入页要列出支持的格式、按编码体系筛方案。
xime-lexicon = { path = "../xime-lexicon" }
# 设备关联页（pair-page）：局域网 P2P 配对。可选，未启用该页的宿主不必链接。
xime-p2p = { workspace = true, optional = true }
serde = { workspace = true, features = ["derive"] }
serde_yaml.workspace = true
serde_json = "1"
tracing.workspace = true
rust-embed = { version = "8", features = ["interpolate-folder-path", "include-exclude"] }
anyhow = "1.0"
reqwest.workspace = true
zip = "8.6.0"
tar = "0.4"
flate2 = "1"
sha2 = "0.10"
hex = "0.4"
toml.workspace = true
base64.workspace = true
getrandom.workspace = true
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Foundation",
    "Media_SpeechRecognition",
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_Registry",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
windows-core = "0.62.2"
windows-future = "0.3"
arboard.workspace = true
rfd.workspace = true

# 词典管理（dict-page）：原生文件对话框。Linux 走 xdg-desktop-portal
# （KDE/GNOME 标配），不引 GTK 构建依赖。
[target.'cfg(target_os = "linux")'.dependencies]
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "async-std"] }
# 语音页复制识别文本（arboard 带 wayland-data-control，KDE 可用）。
arboard.workspace = true

# 方案包导入的「浏览文件」「从剪贴板读取」在三个平台都要用（state.rs 无条件编译），
# 因此 macOS 同样需要这两个依赖。
[target.'cfg(target_os = "macos")'.dependencies]
arboard.workspace = true
rfd.workspace = true

[features]
default = []
smart-suggestion-page = []
pair-page = ["dep:xime-p2p"]
clipboard-page = []
backup-page = []
voice-page = []
dict-page = []

[dev-dependencies]
tempfile.workspace = true
